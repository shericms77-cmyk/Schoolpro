<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SchoolPro — IQRA Model School Pabbi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#0d1b2a;color:#E8EDF2;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#1a2f47;border-radius:20px;padding:36px 28px;width:100%;max-width:360px;margin:20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.logo{font-size:48px;margin-bottom:12px}
h2{font-size:24px;font-weight:800;margin-bottom:4px}
.sub{color:#9BB0C8;font-size:13px;margin-bottom:24px}
.inp{width:100%;background:#0d1b2a;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 14px;color:#E8EDF2;font-size:14px;font-family:'Outfit',sans-serif;outline:none;margin-bottom:10px;display:block}
.inp:focus{border-color:#1565C0}
.btn{width:100%;padding:13px;border-radius:10px;border:none;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px}
.btn-blue{background:#1565C0;color:#fff}
.btn-teal{background:#00897B;color:#fff}
.btn-google{background:#fff;color:#333;display:flex;align-items:center;justify-content:center;gap:8px}
.err{background:rgba(198,40,40,0.2);border:1px solid #EF5350;border-radius:8px;padding:10px;font-size:13px;color:#EF5350;margin-bottom:10px;display:none;text-align:left}
.toggle{font-size:12px;color:#42A5F5;cursor:pointer;margin-top:8px;display:block}
.divider{color:#5C7A99;font-size:12px;margin:12px 0;position:relative}
.divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(255,255,255,0.08)}
.divider span{position:relative;background:#1a2f47;padding:0 10px}
#register-form{display:none}
.note{font-size:11px;color:#5C7A99;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🏫</div>
  <h2>SchoolPro</h2>
  <p class="sub">IQRA Model School Pabbi</p>

  <!-- LOGIN FORM -->
  <div id="login-form">
    <div class="err" id="login-err"></div>
    <input class="inp" type="email" id="l-email" placeholder="Email address">
    <input class="inp" type="password" id="l-pass" placeholder="Password">
    <button class="btn btn-blue" onclick="doLogin()">🔑 Sign In</button>
    <div class="divider"><span>or</span></div>
    <button class="btn btn-google" onclick="doGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.8 13.5-4.7l-6.2-5.2C29.4 35.6 26.8 36.5 24 36.5c-5.2 0-9.6-3.5-11.2-8.2l-6.5 5C9.9 40 16.5 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.4 4.2-4.4 5.5l6.2 5.2C41.1 35.4 44 30.1 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
      Continue with Google
    </button>
    <span class="toggle" onclick="showReg()">No account? Register here →</span>
  </div>

  <!-- REGISTER FORM -->
  <div id="register-form">
    <div class="err" id="reg-err"></div>
    <input class="inp" type="text" id="r-name" placeholder="Full Name">
    <input class="inp" type="email" id="r-email" placeholder="Email address">
    <input class="inp" type="password" id="r-pass" placeholder="Password (min 6 chars)">
    <button class="btn btn-teal" onclick="doRegister()">✅ Create Account</button>
    <span class="toggle" onclick="showLogin()">← Back to Sign In</span>
  </div>

  <p class="note">🔒 Data stored in Firebase Cloud<br>Deleting app never loses your data</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         GoogleAuthProvider, signInWithRedirect, getRedirectResult,
         onAuthStateChanged, updateProfile, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBepfsv5cUJYLoEZVjLQs_Dp8Y8wGq3DqU",
  authDomain: "iqra-model-school-pabbi.firebaseapp.com",
  projectId: "iqra-model-school-pabbi",
  storageBucket: "iqra-model-school-pabbi.firebasestorage.app",
  messagingSenderId: "913481081823",
  appId: "1:913481081823:web:840e865c726f6368fe9a6a"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// Handle Google redirect result
getRedirectResult(auth).catch(e => console.log('redirect:', e.code));

// Auth state
onAuthStateChanged(auth, async user => {
  if (user) {
    // Save user to Firestore
    const ref  = doc(db, 'users', user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, {
        uid: user.uid, name: user.displayName||'User',
        email: user.email, photo: user.photoURL||'',
        role: 'parent', createdAt: serverTimestamp()
      });
    }
    // Redirect to main app
    window.location.href = 'app.html';
  }
});

// Make functions global
window.showReg   = () => { document.getElementById('login-form').style.display='none'; document.getElementById('register-form').style.display='block'; };
window.showLogin = () => { document.getElementById('register-form').style.display='none'; document.getElementById('login-form').style.display='block'; };

function showErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = '⚠️ ' + msg;
  el.style.display = 'block';
}

window.doLogin = async () => {
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  if (!email || !pass) { showErr('login-err','Enter email and password'); return; }
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    showErr('login-err', e.code==='auth/invalid-credential'||e.code==='auth/wrong-password' ? 'Wrong email or password' : e.code==='auth/user-not-found' ? 'No account found. Register first.' : e.message);
  }
};

window.doRegister = async () => {
  const name  = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const pass  = document.getElementById('r-pass').value;
  if (!name||!email||!pass) { showErr('reg-err','Fill all fields'); return; }
  if (pass.length < 6) { showErr('reg-err','Password must be 6+ characters'); return; }
  try {
    const result = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(result.user, { displayName: name });
  } catch(e) {
    showErr('reg-err', e.code==='auth/email-already-in-use' ? 'Email already registered. Sign in instead.' : e.message);
  }
};

window.doGoogle = async () => {
  try {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    await signInWithRedirect(auth, provider);
  } catch(e) { showErr('login-err', e.message); }
};
</script>
</body>
</html>
